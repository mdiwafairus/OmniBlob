server:
  host: "0.0.0.0"
  port: 8080
  read_timeout_sec: 30
  write_timeout_sec: 60
  max_upload_size_mb: 100
  allowed_extensions: [".pdf", ".jpg", ".jpeg", ".png", ".docx", ".zip"]

  # Global / Fallback Authentication (Optional)
  api_key: "CHANGE_ME_SECRET_KEY"
  api_user: "admin"
  api_pass: "admin123"

  # Per-Application Authentication Clients (Multi-tenant)
  clients:
    - name: "app-example-1"
      api_key: "APP1_SECRET_KEY"
      user: "app1_user"
      password: "app1_password"
      allowed_modules: ["*"]

auth:
  access_key: "YOUR_ACCESS_KEY"
  secret_key: "YOUR_SECRET_KEY"

security:
  enabled: false
  mode: "direct_socket" # direct_socket (Layer 4 drop) or behind_proxy
  allowed_socket_ips: 
    - "127.0.0.1/32"
    - "192.168.1.0/24"
  auth_type: "ip_only" # ip_only, token_only, both

storage:
  # Base directory for new sharded storage
  root_path: "/var/omniblob/data" # Example for Linux. Change to D:/omniblob for Windows.
  # Legacy directory where unmigrated files reside (fallback)
  legacy_path: "/var/legacy/uploads"
  # Sharding structure: "date" (module/YYYY/MM/DD/file) or "hash"
  sharding_type: "date"

migration:
  enabled: false
  batch_size: 200
  interval_sec: 3
  worker_count: 2

database:
  host: localhost
  port: 5432
  username: postgres
  password: "YOUR_DB_PASSWORD"
  name: omniblob
  sslmode: disable

  max_open_conn: 20
  min_open_conn: 5
  max_idle_time: 30
  max_life_time: 60
