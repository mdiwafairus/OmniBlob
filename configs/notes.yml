git commit -m "fix: resolve complex merge conflicts and broken builds 
This commit resolves several compilation errors and missing implementations caused by conflicting PR merges across multiple feature branches.Key fixes include:
- Auto-Discovery: Added the missing 'Directory' parameter to MigrateLegacyFile.
- Quarantine: Restored 'ExistsByPath' to BinaryFileRepository.
- IP Whitelist: Fixed NewSuspectLogger and restored WhitelistIPs/Security configs.
- Presigned URL: Re-implemented GeneratePresignedURL in handler.go.
- Dashboard: Corrected routing method calls (GetSummary, GetAnalytics, GetQuality).
- Bugfix: Fixed invalid string formatting in API responses."


