# Copy this file to configs/config.yaml and adjust your credentials

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout_sec: 30
  write_timeout_sec: 60
  max_upload_size_mb: 100
  allowed_extensions: [".pdf", ".jpg", ".jpeg", ".png", ".docx"]

  # Global / Fallback Authentication
  api_key: "your_secret_api_key_here"
  api_user: "your_api_username_here"
  api_pass: "your_api_password_here"

  # Per-Application Authentication Clients
  clients:
    - name: "fe-pwni"
      api_key: "fe_pwni_secret_key_here"
      user: "fe_pwni"
      password: "fe_pwni_password_here"
      allowed_modules: ["*"]

    - name: "be-pwni"
      api_key: "be_pwni_secret_key_here"
      user: "be_pwni"
      password: "be_pwni_password_here"
      allowed_modules: ["*"]

    - name: "pelayanan-app"
      api_key: "pelayanan_secret_key_here"
      user: "pelayanan_app"
      password: "pelayanan_password_here"
      allowed_modules: ["*"]

security:
  enabled: false
  mode: "direct_socket" # direct_socket or behind_proxy
  allowed_socket_ips: 
    - "127.0.0.1/32"
    - "192.168.1.0/24"
  auth_type: "ip_only" # ip_only, token_only, both

storage:
  # Base directory for new sharded storage
  root_path: "./data/storage"
  # Legacy directory where unmigrated files reside (fallback)
  legacy_path: "./data/legacy_uploads"
  # Sharding structure: "date" (module/YYYY/MM/DD/file) or "hash"
  sharding_type: "date"

migration:
  enabled: false
  batch_size: 100
  interval_sec: 10
  worker_count: 4

reconciliation:
  enabled: false
  batch_size: 500
  interval_sec: 3600 # Runs every hour

database:
  host: "localhost"
  port: 5432
  username: "postgres"
  password: "your_database_password_here"
  name: "peduliwni"
  sslmode: "disable"

  max_open_conn: 20
  min_open_conn: 5
  max_idle_time: 30
  max_life_time: 60
